<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actifs — Orus Shield</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F5}
a{color:#0F766E}a:hover{color:#115E59}
input::placeholder{color:#7A848E}
</style>
</head>
<body>
<div id="app"></div>
<template id="page-template">

<div style="font-family: Inter, system-ui, sans-serif; color: #0E1116; background: #F6F7F5; min-height: 100vh; display: flex; flex-wrap: wrap">

<aside style="flex: 1 1 240px; max-width: 100%; background: #0E1116; color: #C9D3DB; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #E6EDF3; padding: 0 8px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Orus Shield</span>
</a>
<nav aria-label="Application" style="display: flex; flex-direction: column; gap: 4px; font-size: 15px">
<a href="dashboard.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #B8C4CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Vue d'ensemble</a>
<a href="surface.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #B8C4CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>Surface d'attaque</a>
<a href="priorisation.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #B8C4CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h5"></path></svg>Priorisation</a>
<a href="issues.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #B8C4CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3l9 16H3L12 3z"></path><path d="M12 10v4M12 17v.5"></path></svg>Vulnérabilités</a>
<a href="posture.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #B8C4CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4-5"></path></svg>Posture et conformité</a>
<a href="gouvernance.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #B8C4CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4V3h6v1M9 13l2 2 4-4"></path></svg>Gouvernance</a>
<a href="assets.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #FFFFFF; background: #1C262F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"></path></svg>Actifs</a>
<a href="scans.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #B8C4CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Scans</a>
<a href="settings.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #B8C4CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Paramètres</a>
</nav>
</aside>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px 36px 48px; box-sizing: border-box">
<p style="margin: 0; font-size: 14px; color: #5B6570">Microfinance Exemple SA</p>
<h1 style="margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; letter-spacing: -0.02em">Actifs</h1>

<section style="margin-top: 24px; background: #FFFFFF; border: 1px solid #E3E7EC; border-radius: 16px; padding: 24px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Ajouter un actif</h2>
<p style="margin: 6px 0 0; font-size: 14px; color: #5B6570">Les scans actifs ne démarrent qu'après vérification de la propriété.</p>
<div style="margin-top: 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px; flex: 0 1 220px">
<label for="atype" style="font-size: 13px; font-weight: 500">Type</label>
<select id="atype" style="height: 44px; padding: 0 12px; font: inherit; font-size: 15px; border: 1px solid #D5DAE1; border-radius: 10px; background: #FFFFFF; color: #0E1116">
<option>Domaine</option><option>Adresse IP ou plage</option><option>Application web</option><option>Microsoft 365</option><option>Google Workspace</option><option>Compte cloud (AWS, Azure)</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 280px">
<label for="aname" style="font-size: 13px; font-weight: 500">Adresse</label>
<input id="aname" type="text" value="{{name}}" onChange="{{onName}}" placeholder="agence-pointenoire.microfinance.cg" style="height: 44px; box-sizing: border-box; padding: 0 12px; font: inherit; font-size: 15px; border: 1px solid #D5DAE1; border-radius: 10px; color: #0E1116">
</div>
<div style="display: flex; flex-direction: column; gap: 6px; flex: 0 1 200px">
<label for="acrit" style="font-size: 13px; font-weight: 500">Criticité métier</label>
<select id="acrit" style="height: 44px; padding: 0 12px; font: inherit; font-size: 15px; border: 1px solid #D5DAE1; border-radius: 10px; background: #FFFFFF; color: #0E1116"><option>Haute</option><option>Moyenne</option><option>Basse</option></select>
</div>
<button type="button" onClick="{{add}}" style="height: 44px; padding: 0 18px; font: inherit; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #0C5DA5; border: 0; border-radius: 10px; cursor: pointer">Ajouter</button>
</div>
<p style="margin: 8px 0 0; font-size: 13px; color: #B42318">{{error}}</p>

<template data-if="pending">
<div style="margin-top: 12px; background: #F6F8FA; border: 1px solid #E3E7EC; border-radius: 14px; padding: 20px">
<p style="margin: 0; font-size: 15px; font-weight: 600">Vérifiez la propriété de {{added}}</p>
<p style="margin: 6px 0 0; font-size: 14px; color: #3D4752">Ajoutez cet enregistrement TXT dans la zone DNS du domaine, puis lancez la vérification.</p>
<pre style="margin: 14px 0 0; padding: 14px 16px; background: #0E1116; color: #D1E9FF; border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px; overflow-x: auto">_orus-verify.{{added}}  TXT  "orus-site-verification=8f3k2q9x7m"</pre>
<div style="margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap">
<button type="button" onClick="{{verify}}" style="min-height: 44px; padding: 0 16px; font: inherit; font-size: 14px; font-weight: 600; color: #FFFFFF; background: #0C5DA5; border: 0; border-radius: 10px; cursor: pointer">Vérifier maintenant</button>
<button type="button" style="min-height: 44px; padding: 0 16px; font: inherit; font-size: 14px; color: #0E1116; background: #FFFFFF; border: 1px solid #D5DAE1; border-radius: 10px; cursor: pointer">Envoyer les instructions à mon informaticien</button>
</div>
</div>
</template>
<template data-if="verified">
<p style="margin: 12px 0 0; font-size: 14px; color: #067647; background: #DCFAE6; padding: 12px 14px; border-radius: 10px">Propriété vérifiée pour {{added}}. Le premier scan complet démarre maintenant.</p>
</template>
</section>

<section style="margin-top: 16px; background: #FFFFFF; border: 1px solid #E3E7EC; border-radius: 16px; padding: 24px">
<div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Actifs surveillés</h2>
<p style="margin: 0; font-size: 13px; color: #5B6570">{{total}} actifs</p>
</div>
<div style="margin-top: 12px; overflow-x: auto">
<table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 14px">
<thead><tr style="text-align: left; color: #5B6570; font-size: 13px"><th style="padding: 12px 8px; font-weight: 500; border-bottom: 1px solid #E3E7EC">Actif</th><th style="padding: 12px 8px; font-weight: 500; border-bottom: 1px solid #E3E7EC">Type</th><th style="padding: 12px 8px; font-weight: 500; border-bottom: 1px solid #E3E7EC">Criticité</th><th style="padding: 12px 8px; font-weight: 500; border-bottom: 1px solid #E3E7EC">Propriété</th><th style="padding: 12px 8px; font-weight: 500; border-bottom: 1px solid #E3E7EC">Score</th><th style="padding: 12px 8px; font-weight: 500; border-bottom: 1px solid #E3E7EC">Ouvertes</th></tr></thead>
<tbody>
<template data-for="assets" data-as="a">
<tr><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4; font-weight: 500">{{a.name}}</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4; color: #5B6570">{{a.type}}</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">{{a.crit}}</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4"><span style="{{a.statusStyle}}">{{a.status}}</span></td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4; font-weight: 600">{{a.score}}</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">{{a.open}}</td></tr>
</template>
</tbody>
</table>
</div>
</section>

<section style="margin-top: 16px; background: #FFFFFF; border: 1px solid #E3E7EC; border-radius: 16px; padding: 24px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Découverts automatiquement</h2>
<p style="margin: 6px 0 0; font-size: 14px; color: #5B6570">Ces éléments semblent vous appartenir mais ne sont pas encore surveillés.</p>
<div style="margin-top: 14px; display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #EEF1F4"><div><p style="margin: 0; font-weight: 500">test.microfinance.cg</p><p style="margin: 2px 0 0; font-size: 13px; color: #5B6570">Sous-domaine · trouvé via certificats publics</p></div><button type="button" style="min-height: 40px; padding: 0 14px; font: inherit; font-size: 14px; color: #0E1116; background: #FFFFFF; border: 1px solid #D5DAE1; border-radius: 10px; cursor: pointer">Surveiller</button></div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #EEF1F4"><div><p style="margin: 0; font-weight: 500">ancien-site.microfinance.cg</p><p style="margin: 2px 0 0; font-size: 13px; color: #5B6570">Sous-domaine · enregistrement DNS actif</p></div><button type="button" style="min-height: 40px; padding: 0 14px; font: inherit; font-size: 14px; color: #0E1116; background: #FFFFFF; border: 1px solid #D5DAE1; border-radius: 10px; cursor: pointer">Surveiller</button></div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0"><div><p style="margin: 0; font-weight: 500">196.x.x.31</p><p style="margin: 2px 0 0; font-size: 13px; color: #5B6570">Adresse IP · même bloc réseau</p></div><button type="button" style="min-height: 40px; padding: 0 14px; font: inherit; font-size: 14px; color: #0E1116; background: #FFFFFF; border: 1px solid #D5DAE1; border-radius: 10px; cursor: pointer">Surveiller</button></div>
</div>
</section>
</main>
</div>
</template>
<script>
// Minimal runtime for the Orus Shield prototype pages: renders a template with
// {{holes}}, data-for / data-if blocks and on* event bindings, and re-renders on setState.
(function () {
  var comp = null, tpl = null, root = null;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function eventFor(el, name) {
    if (name === 'onclick') return 'click';
    if (name === 'onchange') {
      var t = (el.getAttribute('type') || '').toLowerCase();
      return el.tagName === 'INPUT' && t !== 'checkbox' && t !== 'radio' ? 'input' : 'change';
    }
    return name.slice(2);
  }
  function processAttrs(el, scope) {
    var attrs = Array.prototype.slice.call(el.attributes);
    attrs.forEach(function (a) {
      var name = a.name, val = a.value;
      if (name.indexOf('on') === 0 && /^\{\{[^}]+\}\}$/.test(val.trim())) {
        el.removeAttribute(name);
        var fn = lookup(val.trim().slice(2, -2), scope);
        if (typeof fn === 'function') el.addEventListener(eventFor(el, name), fn);
        return;
      }
      if (val.indexOf('{{') === -1) return;
      var whole = /^\{\{[^}]+\}\}$/.test(val.trim());
      var v = whole ? lookup(val.trim().slice(2, -2), scope) : interp(val, scope);
      if (name === 'value' && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) {
        el.removeAttribute('value');
        el.__value = v == null ? '' : String(v);
        return;
      }
      if (v === false || v == null) el.removeAttribute(name); else el.setAttribute(name, String(v));
    });
  }
  function processChildren(parent, scope) {
    var kids = Array.prototype.slice.call(parent.childNodes);
    kids.forEach(function (n) { processNode(n, scope); });
  }
  function processNode(n, scope) {
    if (n.nodeType === 3) {
      if (n.nodeValue.indexOf('{{') !== -1) n.nodeValue = interp(n.nodeValue, scope);
      return;
    }
    if (n.nodeType !== 1) return;
    if (n.tagName === 'TEMPLATE' && (n.hasAttribute('data-for') || n.hasAttribute('data-if'))) {
      var frag = document.createDocumentFragment();
      if (n.hasAttribute('data-for')) {
        var list = lookup(n.getAttribute('data-for'), scope) || [];
        var as = n.getAttribute('data-as');
        list.forEach(function (item, i) {
          var s = Object.create(scope); s[as] = item; s.$index = i;
          var c = n.content.cloneNode(true); processChildren(c, s); frag.appendChild(c);
        });
      } else if (lookup(n.getAttribute('data-if'), scope)) {
        var c2 = n.content.cloneNode(true); processChildren(c2, scope); frag.appendChild(c2);
      }
      n.parentNode.replaceChild(frag, n);
      return;
    }
    processAttrs(n, scope);
    processChildren(n, scope);
  }
  function render() {
    var active = document.activeElement, id = active && active.id, sel = null;
    if (id && active.selectionStart != null) { try { sel = [active.selectionStart, active.selectionEnd]; } catch (e) { sel = null; } }
    var frag = tpl.content.cloneNode(true);
    processChildren(frag, comp.renderVals());
    root.replaceChildren(frag);
    root.querySelectorAll('input, textarea').forEach(function (el) { if (el.__value !== undefined) el.value = el.__value; });
    if (id) {
      var again = document.getElementById(id);
      if (again) { again.focus(); if (sel) { try { again.setSelectionRange(sel[0], sel[1]); } catch (e) { /* not a text field */ } } }
    }
  }
  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (patch) {
    var p = typeof patch === 'function' ? patch(this.state, this.props) : patch;
    this.state = Object.assign({}, this.state, p);
    render();
  };
  window.DCLogic.prototype.forceUpdate = function () { render(); };
  window.mountPrototype = function (Component) {
    tpl = document.getElementById('page-template');
    root = document.getElementById('app');
    comp = new Component({});
    render();
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: '', added: '', step: 'idle', error: '', extra: [] };
  }
  renderVals() {
    const ok = 'font-size: 12px; font-weight: 600; color: #067647; background: #DCFAE6; padding: 3px 8px; border-radius: 6px';
    const wait = 'font-size: 12px; font-weight: 600; color: #B54708; background: #FEF0C7; padding: 3px 8px; border-radius: 6px';
    const base = [
      { name: 'microfinance.cg', type: 'Domaine', crit: 'Haute', status: 'Vérifiée', statusStyle: ok, score: 86, open: 2 },
      { name: 'portail.microfinance.cg', type: 'Application web', crit: 'Haute', status: 'Vérifiée', statusStyle: ok, score: 57, open: 5 },
      { name: 'srv-compta.microfinance.cg', type: 'Serveur', crit: 'Haute', status: 'Vérifiée', statusStyle: ok, score: 38, open: 6 },
      { name: 'www.microfinance.cg', type: 'Site vitrine', crit: 'Moyenne', status: 'Vérifiée', statusStyle: ok, score: 64, open: 3 },
      { name: 'Microsoft 365', type: 'SaaS', crit: 'Haute', status: 'Connecté', statusStyle: ok, score: 61, open: 4 },
      { name: '196.x.x.16/29', type: 'Plage IP', crit: 'Moyenne', status: 'Vérifiée', statusStyle: ok, score: 79, open: 3 }
    ];
    const extra = this.state.extra.map((n) => ({
      name: n, type: 'Domaine', crit: 'Haute',
      status: this.state.step === 'verified' ? 'Vérifiée' : 'En attente',
      statusStyle: this.state.step === 'verified' ? ok : wait,
      score: '—', open: '—'
    }));
    const assets = base.concat(extra);
    return {
      name: this.state.name,
      onName: (e) => this.setState({ name: e.target.value, error: '' }),
      add: () => {
        const n = this.state.name.trim();
        if (!n) { this.setState({ error: 'Saisissez une adresse avant d’ajouter.' }); return; }
        this.setState({ added: n, step: 'pending', name: '', extra: [n] });
      },
      verify: () => this.setState({ step: 'verified' }),
      error: this.state.error,
      added: this.state.added,
      pending: this.state.step === 'pending',
      verified: this.state.step === 'verified',
      assets, total: assets.length
    };
  }
}
mountPrototype(Component);
</script>
</body>
</html>
