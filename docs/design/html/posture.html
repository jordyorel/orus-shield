<script>
// Minimal runtime for the Orus Shield prototype pages: renders a template with
// {{holes}}, data-for / data-if blocks and on* event bindings, and re-renders on setState.
(function () {
  var comp = null, tpl = null, root = null;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function eventFor(el, name) {
    if (name === 'onclick') return 'click';
    if (name === 'onchange') {
      var t = (el.getAttribute('type') || '').toLowerCase();
      return el.tagName === 'INPUT' && t !== 'checkbox' && t !== 'radio' ? 'input' : 'change';
    }
    return name.slice(2);
  }
  function processAttrs(el, scope) {
    var attrs = Array.prototype.slice.call(el.attributes);
    attrs.forEach(function (a) {
      var name = a.name, val = a.value;
      if (name.indexOf('on') === 0 && /^\{\{[^}]+\}\}$/.test(val.trim())) {
        el.removeAttribute(name);
        var fn = lookup(val.trim().slice(2, -2), scope);
        if (typeof fn === 'function') el.addEventListener(eventFor(el, name), fn);
        return;
      }
      if (val.indexOf('{{') === -1) return;
      var whole = /^\{\{[^}]+\}\}$/.test(val.trim());
      var v = whole ? lookup(val.trim().slice(2, -2), scope) : interp(val, scope);
      if (name === 'value' && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) {
        el.removeAttribute('value');
        el.__value = v == null ? '' : String(v);
        return;
      }
      if (v === false || v == null) el.removeAttribute(name); else el.setAttribute(name, String(v));
    });
  }
  function processChildren(parent, scope) {
    var kids = Array.prototype.slice.call(parent.childNodes);
    kids.forEach(function (n) { processNode(n, scope); });
  }
  function processNode(n, scope) {
    if (n.nodeType === 3) {
      if (n.nodeValue.indexOf('{{') !== -1) n.nodeValue = interp(n.nodeValue, scope);
      return;
    }
    if (n.nodeType !== 1) return;
    if (n.tagName === 'TEMPLATE' && (n.hasAttribute('data-for') || n.hasAttribute('data-if'))) {
      var frag = document.createDocumentFragment();
      if (n.hasAttribute('data-for')) {
        var list = lookup(n.getAttribute('data-for'), scope) || [];
        var as = n.getAttribute('data-as');
        list.forEach(function (item, i) {
          var s = Object.create(scope); s[as] = item; s.$index = i;
          var c = n.content.cloneNode(true); processChildren(c, s); frag.appendChild(c);
        });
      } else if (lookup(n.getAttribute('data-if'), scope)) {
        var c2 = n.content.cloneNode(true); processChildren(c2, scope); frag.appendChild(c2);
      }
      n.parentNode.replaceChild(frag, n);
      return;
    }
    processAttrs(n, scope);
    processChildren(n, scope);
  }
  function render() {
    var active = document.activeElement, id = active && active.id, sel = null;
    if (id && active.selectionStart != null) { try { sel = [active.selectionStart, active.selectionEnd]; } catch (e) { sel = null; } }
    var frag = tpl.content.cloneNode(true);
    processChildren(frag, comp.renderVals());
    root.replaceChildren(frag);
    root.querySelectorAll('input, textarea').forEach(function (el) { if (el.__value !== undefined) el.value = el.__value; });
    if (id) {
      var again = document.getElementById(id);
      if (again) { again.focus(); if (sel) { try { again.setSelectionRange(sel[0], sel[1]); } catch (e) { /* not a text field */ } } }
    }
  }
  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (patch) {
    var p = typeof patch === 'function' ? patch(this.state, this.props) : patch;
    this.state = Object.assign({}, this.state, p);
    render();
  };
  window.DCLogic.prototype.forceUpdate = function () { render(); };
  window.mountPrototype = function (Component) {
    tpl = document.getElementById('page-template');
    root = document.getElementById('app');
    comp = new Component({});
    render();
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'home', cat: 'id', stars: { iso: true, pci: true, data: true } };
  }
  renderVals() {
    const s = this.state;
    const tabOn = 'min-height: 44px; padding: 0 4px; margin-right: 14px; margin-bottom: -1px; font: inherit; font-size: 15px; font-weight: 600; color: #0E1116; background: transparent; border: 0; border-bottom: 2px solid #0C5DA5; cursor: pointer';
    const tabOff = 'min-height: 44px; padding: 0 4px; margin-right: 14px; margin-bottom: -1px; font: inherit; font-size: 15px; color: #5B6570; background: transparent; border: 0; border-bottom: 2px solid transparent; cursor: pointer';
    const defs = [
      ['mail', 'EMAILS', 3, 'domaines', 2, ['DMARC en mode surveillance (p=none)', 'Aucune clé DKIM trouvée pour un sélecteur courant']],
      ['web', 'WEB', 4, 'sites', 8, ['En-têtes de sécurité manquants sur le portail', 'WordPress et une extension obsolètes', 'Formulaire de connexion sans limite de tentatives']],
      ['tls', 'TLS ET CERTIFICATS', 7, 'certificats', 2, ['Certificat du portail expirant dans 9 jours', 'TLS 1.0 et 1.1 acceptés sur le serveur de messagerie']],
      ['dns', 'DNS', 9, 'domaines', 1, ['Sous-domaine pointant vers un service supprimé (risque de prise de contrôle)']],
      ['id', 'IDENTITÉS ET ACCÈS', 42, 'comptes', 18, ['18 comptes sans double authentification, dont 2 administrateurs', 'Partage externe de fichiers autorisé pour tous', '4 comptes inactifs depuis plus de 90 jours']],
      ['net', 'RÉSEAU ET PORTS', 6, 'adresses IP', 3, ['Bureau à distance (3389) exposé sur internet', 'Serveur SSH avec une version vulnérable']],
      ['cloud', 'CLOUD', 0, 'comptes', 0, ['Aucun compte cloud connecté : connectez AWS, Azure ou Google Cloud']],
      ['leak', 'FUITES DE DONNÉES', 3, 'adresses', 0, ['3 adresses présentes dans une fuite publique : mots de passe à changer']]
    ];
    const cats = defs.map(([id, name, count, unit, risks, checks]) => {
      const sel = s.cat === id;
      const badge = risks > 0 ? risks + ' RISQUES' : (id === 'cloud' ? 'À CONNECTER' : 'OK');
      const badgeStyle = risks > 0 ? 'font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 4px; ' + (risks >= 5 ? 'color: #B42318; background: #FEE4E2' : 'color: #B54708; background: #FEF0C7') : (id === 'cloud' ? 'font-size: 12px; font-weight: 600; color: #475467; background: #EAECF0; padding: 4px 8px; border-radius: 4px' : 'font-size: 12px; font-weight: 600; color: #067647; background: #DCFAE6; padding: 4px 8px; border-radius: 4px');
      return {
        name, count, unit, badge, badgeStyle, pressed: sel ? 'true' : 'false',
        style: 'text-align: left; font: inherit; padding: 22px 24px; background: #FFFFFF; border-radius: 12px; cursor: pointer; border: ' + (sel ? '2px solid #0C5DA5' : '2px solid #E3E7EC'),
        pick: () => this.setState({ cat: id }), id, checks
      };
    });
    const sel = cats.find((c) => c.id === s.cat);
    const reports = [
      ['iso', 'ISO', 'ISO 27001', 'v2022', 31, 19],
      ['pci', 'PCI', 'PCI DSS', 'v4.0.1', 24, 26],
      ['data', 'DP', 'Protection des données', 'RGPD et lois africaines', 22, 9],
      ['cis', 'CIS', 'CIS Microsoft 365', 'v4.0', 14, 11]
    ].map(([id, abbr, name, ver, pass, fail]) => {
      const on = !!s.stars[id];
      return {
        abbr, name, ver, pass, fail, starred: on ? 'true' : 'false', starFill: on ? '#F2C200' : 'none',
        starAria: (on ? 'Retirer ' : 'Ajouter ') + name + (on ? ' des favoris' : ' aux favoris'),
        star: () => this.setState({ stars: { ...s.stars, [id]: !on } })
      };
    });
    return {
      homeTab: s.tab === 'home' ? tabOn : tabOff, invTab: s.tab === 'inv' ? tabOn : tabOff,
      homePressed: s.tab === 'home' ? 'true' : 'false', invPressed: s.tab === 'inv' ? 'true' : 'false',
      showHome: () => this.setState({ tab: 'home' }), showInv: () => this.setState({ tab: 'inv' }),
      cats, sel, reports
    };
  }
}
mountPrototype(Component);
</script>
</body>
