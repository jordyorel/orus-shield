<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuration des scans — Orus Shield</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">

a{color:#0F766E}a:hover{color:#115E59}

</head>
<body>

<template id="page-template">

<div style="font-family: Inter, system-ui, sans-serif; color: #0E1116; background: #F6F7F5; min-height: 100vh; display: flex; flex-wrap: wrap">

<aside style="flex: 1 1 240px; max-width: 100%; background: #0E1116; color: #C9D3DB; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">

<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Orus Shield</span>
</a>
<nav aria-label="Application" style="display: flex; flex-direction: column; gap: 4px; font-size: 15px">
<a href="dashboard.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #B8C4CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>Vue d'ensemble</a>
<a href="surface.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #B8C4CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>Surface d'attaque</a>

<a href="issues.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #B8C4CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3l9 16H3L12 3z"></path><path d="M12 10v4M12 17v.5"></path></svg>Vulnérabilités</a>
<a href="posture.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #B8C4CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4-5"></path></svg>Posture et conformité</a>

<a href="assets.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #B8C4CE"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"></path></svg>Actifs</a>

</aside>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px 36px 48px; box-sizing: border-box">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div>
<p style="margin: 0; font-size: 14px; color: #5B6570">Microfinance Exemple SA</p>
<h1 style="margin: 4px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; letter-spacing: -0.02em">Configuration des scans</h1>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center">
<span style="font-size: 14px; color: #067647">{{savedMsg}}</span>
<button type="button" style="min-height: 44px; padding: 0 16px; font: inherit; font-size: 15px; color: #0E1116; background: #FFFFFF; border: 1px solid #D5DAE1; border-radius: 10px; cursor: pointer">Lancer maintenant</button>
<button type="button" onClick="{{save}}" style="min-height: 44px; padding: 0 18px; font: inherit; font-size: 15px; font-weight: 600; color: #FFFFFF; background: #0C5DA5; border: 0; border-radius: 10px; cursor: pointer">Enregistrer</button>
</div>
</div>

<section style="margin-top: 24px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Profil de scan</h2>
<div style="margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<template data-for="profiles" data-as="p">
<button type="button" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="{{p.style}}">
<span style="display: block; font-size: 16px; font-weight: 600; color: #0E1116">{{p.name}}</span>
<span style="display: block; margin-top: 6px; font-size: 14px; line-height: 1.5; color: #3D4752">{{p.desc}}</span>
<span style="display: block; margin-top: 10px; font-size: 13px; color: #067647">{{p.time}}</span>
</button>
</template>
</div>
</section>

<div style="margin-top: 16px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<section style="flex: 1.5 1 480px; min-width: 0; background: #FFFFFF; border: 1px solid #E3E7EC; border-radius: 16px; padding: 24px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Modules</h2>
<p style="margin: 6px 0 0; font-size: 14px; color: #5B6570">{{activeCount}} modules actifs</p>
<div style="margin-top: 8px; display: flex; flex-direction: column">
<template data-for="modules" data-as="m">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid #EEF1F4">
<div style="min-width: 0">
<p style="margin: 0; font-size: 15px; font-weight: 600">{{m.name}} <span style="{{m.tagStyle}}">{{m.tag}}</span></p>
<p style="margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: #5B6570">{{m.desc}}</p>
</div>
<button type="button" onClick="{{m.toggle}}" aria-pressed="{{m.on}}" aria-label="{{m.aria}}" style="{{m.track}}"><span style="{{m.knob}}"></span></button>
</div>
</template>
</div>
</section>

<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section style="background: #FFFFFF; border: 1px solid #E3E7EC; border-radius: 16px; padding: 24px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Planification</h2>
<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="freq" style="font-size: 13px; font-weight: 500">Fréquence</label><select id="freq" style="height: 44px; padding: 0 12px; font: inherit; font-size: 15px; border: 1px solid #D5DAE1; border-radius: 10px; background: #FFFFFF; color: #0E1116"><option>Quotidienne</option><option selected>Hebdomadaire</option><option>Mensuelle</option><option>Continue (surveillance)</option></select></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="day" style="font-size: 13px; font-weight: 500">Jour</label><select id="day" style="height: 44px; padding: 0 12px; font: inherit; font-size: 15px; border: 1px solid #D5DAE1; border-radius: 10px; background: #FFFFFF; color: #0E1116"><option>Dimanche</option><option>Lundi</option><option>Samedi</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="hour" style="font-size: 13px; font-weight: 500">Heure</label><select id="hour" style="height: 44px; padding: 0 12px; font: inherit; font-size: 15px; border: 1px solid #D5DAE1; border-radius: 10px; background: #FFFFFF; color: #0E1116"><option>02:00</option><option>06:00</option><option>22:00</option></select></div>
</div>
<p style="margin: 0; font-size: 13px; color: #5B6570">Fuseau horaire : Africa/Brazzaville (UTC+1)</p>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #E3E7EC; border-radius: 16px; padding: 24px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Intensité</h2>
<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between"><label for="rate" style="font-size: 13px; font-weight: 500">Requêtes par seconde, par actif</label><span style="font-size: 14px; font-weight: 600">{{rate}}</span></div>
<input id="rate" type="range" min="5" max="200" step="5" value="{{rate}}" onChange="{{onRate}}" style="width: 100%">
<p style="margin: 0; font-size: 13px; color: #5B6570">{{rateHint}}</p>
</div>
<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 6px">
<label for="excl" style="font-size: 13px; font-weight: 500">Exclusions</label>
<textarea id="excl" rows="3" style="font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid #D5DAE1; border-radius: 10px; resize: vertical; color: #0E1116">/admin/paiements
196.x.x.20</textarea>
<p style="margin: 0; font-size: 13px; color: #5B6570">Chemins, adresses ou ports à ne jamais tester.</p>
</div>
</section>
</div>
</div>

<section style="margin-top: 16px; background: #FFFFFF; border: 1px solid #E3E7EC; border-radius: 16px; padding: 24px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Historique</h2>
<div style="margin-top: 12px; overflow-x: auto">
<table style="width: 100%; min-width: 700px; border-collapse: collapse; font-size: 14px">
<thead><tr style="text-align: left; color: #5B6570; font-size: 13px"><th style="padding: 12px 8px; font-weight: 500; border-bottom: 1px solid #E3E7EC">Date</th><th style="padding: 12px 8px; font-weight: 500; border-bottom: 1px solid #E3E7EC">Profil</th><th style="padding: 12px 8px; font-weight: 500; border-bottom: 1px solid #E3E7EC">Actifs</th><th style="padding: 12px 8px; font-weight: 500; border-bottom: 1px solid #E3E7EC">Durée</th><th style="padding: 12px 8px; font-weight: 500; border-bottom: 1px solid #E3E7EC">Nouvelles</th><th style="padding: 12px 8px; font-weight: 500; border-bottom: 1px solid #E3E7EC">Statut</th></tr></thead>
<tbody>
<tr><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">08/11, 22:40</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">Standard</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">14</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">—</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">—</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4"><div style="display: flex; align-items: center; gap: 10px"><div style="width: 120px; height: 6px; background: #EEF1F4; border-radius: 3px"><div style="width: 64%; height: 6px; background: #0C5DA5; border-radius: 3px"></div></div><span style="font-size: 13px; color: #067647">En cours · 64 %</span></div></td></tr>
<tr><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">08/11, 06:00</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">Rapide</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">14</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">6 min</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">1</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4; color: #5B6570">Terminé</td></tr>
<tr><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">02/11, 02:00</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">Approfondi</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">13</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">2 h 14</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4">7</td><td style="padding: 14px 8px; border-bottom: 1px solid #EEF1F4; color: #5B6570">Terminé</td></tr>
<tr><td style="padding: 14px 8px">26/10, 02:00</td><td style="padding: 14px 8px">Standard</td><td style="padding: 14px 8px">11</td><td style="padding: 14px 8px">38 min</td><td style="padding: 14px 8px">3</td><td style="padding: 14px 8px; color: #5B6570">Terminé</td></tr>
</tbody>
</table>
</div>
</section>
</main>
</div>
</template>
<script>
// Minimal runtime for the Orus Shield prototype pages: renders a template with
// {{holes}}, data-for / data-if blocks and on* event bindings, and re-renders on setState.
(function () {
  var comp = null, tpl = null, root = null;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function eventFor(el, name) {
    if (name === 'onclick') return 'click';
    if (name === 'onchange') {
      var t = (el.getAttribute('type') || '').toLowerCase();
      return el.tagName === 'INPUT' && t !== 'checkbox' && t !== 'radio' ? 'input' : 'change';
    }
    return name.slice(2);
  }
  function processAttrs(el, scope) {
    var attrs = Array.prototype.slice.call(el.attributes);
    attrs.forEach(function (a) {
      var name = a.name, val = a.value;
      if (name.indexOf('on') === 0 && /^\{\{[^}]+\}\}$/.test(val.trim())) {
        el.removeAttribute(name);
        var fn = lookup(val.trim().slice(2, -2), scope);
        if (typeof fn === 'function') el.addEventListener(eventFor(el, name), fn);
        return;
      }
      if (val.indexOf('{{') === -1) return;
      var whole = /^\{\{[^}]+\}\}$/.test(val.trim());
      var v = whole ? lookup(val.trim().slice(2, -2), scope) : interp(val, scope);
      if (name === 'value' && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) {
        el.removeAttribute('value');
        el.__value = v == null ? '' : String(v);
        return;
      }
      if (v === false || v == null) el.removeAttribute(name); else el.setAttribute(name, String(v));
    });
  }
  function processChildren(parent, scope) {
    var kids = Array.prototype.slice.call(parent.childNodes);
    kids.forEach(function (n) { processNode(n, scope); });
  }
  function processNode(n, scope) {
    if (n.nodeType === 3) {
      if (n.nodeValue.indexOf('{{') !== -1) n.nodeValue = interp(n.nodeValue, scope);
      return;
    }
    if (n.nodeType !== 1) return;
    if (n.tagName === 'TEMPLATE' && (n.hasAttribute('data-for') || n.hasAttribute('data-if'))) {
      var frag = document.createDocumentFragment();
      if (n.hasAttribute('data-for')) {
        var list = lookup(n.getAttribute('data-for'), scope) || [];
        var as = n.getAttribute('data-as');
        list.forEach(function (item, i) {
          var s = Object.create(scope); s[as] = item; s.$index = i;
          var c = n.content.cloneNode(true); processChildren(c, s); frag.appendChild(c);
        });
      } else if (lookup(n.getAttribute('data-if'), scope)) {
        var c2 = n.content.cloneNode(true); processChildren(c2, scope); frag.appendChild(c2);
      }
      n.parentNode.replaceChild(frag, n);
      return;
    }
    processAttrs(n, scope);
    processChildren(n, scope);
  }
  function render() {
    var active = document.activeElement, id = active && active.id, sel = null;
    if (id && active.selectionStart != null) { try { sel = [active.selectionStart, active.selectionEnd]; } catch (e) { sel = null; } }
    var frag = tpl.content.cloneNode(true);
    processChildren(frag, comp.renderVals());
    root.replaceChildren(frag);
    root.querySelectorAll('input, textarea').forEach(function (el) { if (el.__value !== undefined) el.value = el.__value; });
    if (id) {
      var again = document.getElementById(id);
      if (again) { again.focus(); if (sel) { try { again.setSelectionRange(sel[0], sel[1]); } catch (e) { /* not a text field */ } } }
    }
  }
  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (patch) {
    var p = typeof patch === 'function' ? patch(this.state, this.props) : patch;
    this.state = Object.assign({}, this.state, p);
    render();
  };
  window.DCLogic.prototype.forceUpdate = function () { render(); };
  window.mountPrototype = function (Component) {
    tpl = document.getElementById('page-template');
    root = document.getElementById('app');
    comp = new Component({});
    render();
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      profile: 'standard', rate: 50, saved: false,
      on: { disc: true, ports: true, web: true, mail: true, tls: true, m365: true, leaks: true, agents: false, ai: false }
    };
  }
  renderVals() {
    const card = 'text-align: left; font: inherit; padding: 20px; border-radius: 14px; cursor: pointer; background: #FFFFFF; ';
    const profiles = [
      { id: 'quick', name: 'Rapide', desc: 'Vérifications passives et ports principaux.', time: 'Environ 5 min' },
      { id: 'standard', name: 'Standard', desc: 'Tous les modules actifs, sans test intrusif.', time: 'Environ 40 min' },
      { id: 'deep', name: 'Approfondi', desc: 'Tous les ports, tests applicatifs étendus.', time: '2 à 3 h' }
    ].map((p) => ({
      ...p,
      pressed: this.state.profile === p.id ? 'true' : 'false',
      style: card + (this.state.profile === p.id ? 'border: 2px solid #0C5DA5' : 'border: 2px solid #E3E7EC'),
      pick: () => this.setState({ profile: p.id, saved: false })
    }));
    const defs = [
      ['disc', 'Découverte de la surface d’attaque', 'Sous-domaines, certificats publics, plages IP associées.', ''],
      ['ports', 'Ports et services', 'Services exposés, versions et configurations dangereuses.', ''],
      ['web', 'Applications web', 'Injections, authentification, en-têtes, CMS obsolètes.', ''],
      ['mail', 'Sécurité des emails', 'SPF, DKIM, DMARC, serveurs de messagerie.', ''],
      ['tls', 'Certificats et TLS', 'Expiration, protocoles faibles, chaînes invalides.', ''],
      ['m365', 'Microsoft 365', 'Double authentification, administrateurs, partages externes.', ''],
      ['leaks', 'Fuites de données', 'Adresses et identifiants dans des fuites publiques.', ''],
      ['agents', 'Validation par agents IA', 'Tente d’exploiter les failles de façon contrôlée pour éliminer les faux positifs.', 'Intrusif'],
      ['ai', 'Audit de l’usage de l’IA', 'Clés d’API exposées, chatbots vulnérables à l’injection de prompt.', 'Nouveau']
    ];
    const modules = defs.map(([id, name, desc, tag]) => {
      const on = !!this.state.on[id];
      return {
        name, desc, tag,
        tagStyle: tag === 'Intrusif' ? 'font-size: 12px; font-weight: 600; color: #B54708; background: #FEF0C7; padding: 2px 7px; border-radius: 6px; margin-left: 6px' : (tag ? 'font-size: 12px; font-weight: 600; color: #1849A9; background: #E0EAFF; padding: 2px 7px; border-radius: 6px; margin-left: 6px' : 'display: none'),
        on: on ? 'true' : 'false',
        aria: (on ? 'Désactiver ' : 'Activer ') + name,
        track: 'flex: 0 0 auto; position: relative; width: 52px; height: 30px; border: 0; border-radius: 15px; cursor: pointer; padding: 0; background: ' + (on ? '#0C5DA5' : '#C5CCD5'),
        knob: 'position: absolute; top: 3px; left: ' + (on ? '25px' : '3px') + '; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF',
        toggle: () => this.setState({ on: { ...this.state.on, [id]: !on }, saved: false })
      };
    });
    const r = this.state.rate;
    return {
      profiles, modules,
      activeCount: Object.values(this.state.on).filter(Boolean).length,
      rate: r,
      onRate: (e) => this.setState({ rate: Number(e.target.value), saved: false }),
      rateHint: r <= 30 ? 'Doux : adapté aux serveurs fragiles ou aux connexions lentes.' : (r <= 100 ? 'Équilibré : recommandé pour la plupart des PME.' : 'Rapide : à réserver aux infrastructures robustes.'),
      save: () => this.setState({ saved: true }),
      savedMsg: this.state.saved ? 'Configuration enregistrée' : ''
    };
  }
}
mountPrototype(Component);
</script>
</body>
</html>
