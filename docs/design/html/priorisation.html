<script>
// Minimal runtime for the Orus Shield prototype pages: renders a template with
// {{holes}}, data-for / data-if blocks and on* event bindings, and re-renders on setState.
(function () {
  var comp = null, tpl = null, root = null;
  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope) {
    return str.replace(HOLE, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function eventFor(el, name) {
    if (name === 'onclick') return 'click';
    if (name === 'onchange') {
      var t = (el.getAttribute('type') || '').toLowerCase();
      return el.tagName === 'INPUT' && t !== 'checkbox' && t !== 'radio' ? 'input' : 'change';
    }
    return name.slice(2);
  }
  function processAttrs(el, scope) {
    var attrs = Array.prototype.slice.call(el.attributes);
    attrs.forEach(function (a) {
      var name = a.name, val = a.value;
      if (name.indexOf('on') === 0 && /^\{\{[^}]+\}\}$/.test(val.trim())) {
        el.removeAttribute(name);
        var fn = lookup(val.trim().slice(2, -2), scope);
        if (typeof fn === 'function') el.addEventListener(eventFor(el, name), fn);
        return;
      }
      if (val.indexOf('{{') === -1) return;
      var whole = /^\{\{[^}]+\}\}$/.test(val.trim());
      var v = whole ? lookup(val.trim().slice(2, -2), scope) : interp(val, scope);
      if (name === 'value' && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) {
        el.removeAttribute('value');
        el.__value = v == null ? '' : String(v);
        return;
      }
      if (v === false || v == null) el.removeAttribute(name); else el.setAttribute(name, String(v));
    });
  }
  function processChildren(parent, scope) {
    var kids = Array.prototype.slice.call(parent.childNodes);
    kids.forEach(function (n) { processNode(n, scope); });
  }
  function processNode(n, scope) {
    if (n.nodeType === 3) {
      if (n.nodeValue.indexOf('{{') !== -1) n.nodeValue = interp(n.nodeValue, scope);
      return;
    }
    if (n.nodeType !== 1) return;
    if (n.tagName === 'TEMPLATE' && (n.hasAttribute('data-for') || n.hasAttribute('data-if'))) {
      var frag = document.createDocumentFragment();
      if (n.hasAttribute('data-for')) {
        var list = lookup(n.getAttribute('data-for'), scope) || [];
        var as = n.getAttribute('data-as');
        list.forEach(function (item, i) {
          var s = Object.create(scope); s[as] = item; s.$index = i;
          var c = n.content.cloneNode(true); processChildren(c, s); frag.appendChild(c);
        });
      } else if (lookup(n.getAttribute('data-if'), scope)) {
        var c2 = n.content.cloneNode(true); processChildren(c2, scope); frag.appendChild(c2);
      }
      n.parentNode.replaceChild(frag, n);
      return;
    }
    processAttrs(n, scope);
    processChildren(n, scope);
  }
  function render() {
    var active = document.activeElement, id = active && active.id, sel = null;
    if (id && active.selectionStart != null) { try { sel = [active.selectionStart, active.selectionEnd]; } catch (e) { sel = null; } }
    var frag = tpl.content.cloneNode(true);
    processChildren(frag, comp.renderVals());
    root.replaceChildren(frag);
    root.querySelectorAll('input, textarea').forEach(function (el) { if (el.__value !== undefined) el.value = el.__value; });
    if (id) {
      var again = document.getElementById(id);
      if (again) { again.focus(); if (sel) { try { again.setSelectionRange(sel[0], sel[1]); } catch (e) { /* not a text field */ } } }
    }
  }
  window.DCLogic = function DCLogic(props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (patch) {
    var p = typeof patch === 'function' ? patch(this.state, this.props) : patch;
    this.state = Object.assign({}, this.state, p);
    render();
  };
  window.DCLogic.prototype.forceUpdate = function () { render(); };
  window.mountPrototype = function (Component) {
    tpl = document.getElementById('page-template');
    root = document.getElementById('app');
    comp = new Component({});
    render();
  };
})();

</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { net: true, exploited: false, selected: 'bluekeep' };
  }
  renderVals() {
    const s = this.state;
    const all = [
      { key: 'bluekeep', id: 'CVE-2019-0708', name: 'BlueKeep', asset: 'srv-compta', comp: 'Bureau à distance', ver: 'Windows Server 2008 R2', age: '12 j', run: true, net: true, kev: true, poc: true, ctrl: 'Aucune', raw: 9.8, score: 9.6 },

      { key: 'log4j', id: 'CVE-2021-44228', name: 'Log4Shell', asset: 'crm-interne', comp: 'log4j-core', ver: '2.14.1', age: '22 j', run: true, net: false, kev: true, poc: true, ctrl: 'Accès VPN', raw: 10.0, score: 5.1 },
      { key: 'tls10', id: 'ORUS-TLS-002', name: 'TLS 1.0 accepté', asset: 'mail', comp: 'Serveur de messagerie', ver: 'TLS 1.0, 1.1', age: '40 j', run: true, net: true, kev: false, poc: false, ctrl: 'Aucune', raw: 5.9, score: 4.3 },
      { key: 'wp', id: 'ORUS-WEB-011', name: 'Extension WordPress obsolète', asset: 'www', comp: 'contact-form', ver: '5.3', age: '18 j', run: true, net: true, kev: false, poc: true, ctrl: 'WAF Cloudflare', raw: 6.1, score: 2.9 },
      { key: 'regre2', id: 'CVE-2024-6387', name: 'regreSSHion', asset: 'test', comp: 'openssh-server', ver: '8.9p1 (service arrêté)', age: '9 j', run: false, net: true, kev: false, poc: true, ctrl: 'Aucune', raw: 8.1, score: 1.8 }
    ];
    const level = (x) => x >= 9 ? ['Critique', '#B42318'] : x >= 7 ? ['Élevé', '#F79009'] : x >= 4 ? ['Moyen', '#FDB022'] : ['Faible', '#5B8DEF'];
    const on = 'font-size: 13px; font-weight: 500; color: #067647';
    const off = 'font-size: 13px; color: #7A848E';
    const rows = all
      .filter((r) => (!s.net || r.net) && (!s.exploited || r.kev))
      .sort((a, b) => b.score - a.score)
      .map((r) => {
        const [lv, col] = level(r.score);
        const sel = s.selected === r.key;
        return {
          ...r, level: lv, selected: sel,
          run: r.run ? 'Oui' : 'Arrêté', runStyle: r.run ? on : off,
          net: r.net ? 'Oui' : 'Non', netStyle: r.net ? on : off,
          threat: r.kev ? 'Exploitée activement' : (r.poc ? 'Code public' : 'Non connue'),
          threatStyle: r.kev ? 'font-size: 13px; font-weight: 600; color: #B42318' : (r.poc ? 'font-size: 13px; color: #B54708' : off),
          barStyle: 'height: 4px; border-radius: 2px; background: ' + col + '; width: ' + Math.round(r.score * 10) + '%',
          rowStyle: 'background: ' + (sel ? '#F1F6FB' : '#FFFFFF'),
          pick: () => this.setState({ selected: r.key })
        };
      });
    const chipStyle = (active) => 'min-height: 40px; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 500; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; ' + (active ? 'color: #0C447C; background: #E6F1FB; border: 1px solid #B5D4F4' : 'color: #3D4752; background: #FFFFFF; border: 1px dashed #C5CCD5');
    const chips = [
      ['net', 'Exposé à internet : oui'],
      ['exploited', 'Menace : exploitée activement']
    ].map(([k, label]) => ({
      label, pressed: s[k] ? 'true' : 'false', mark: s[k] ? '×' : '+', style: chipStyle(s[k]),
      toggle: () => this.setState({ [k]: !s[k] })
    }));
    return {
      rows, chips, count: rows.length,
      activeCount: (s.net ? 1 : 0) + (s.exploited ? 1 : 0),
      clearAll: () => this.setState({ net: false, exploited: false })
    };
  }
}
mountPrototype(Component);
</script>
</body>
</html>
