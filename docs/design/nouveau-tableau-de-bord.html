<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orus Shield — nouveau tableau de bord</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FB;--surface:#FFFFFF;--ink:#14213D;--ink2:#4A5672;--line:#DFE4EE;--soft:#E9EDF5;--azur:#2F6BFF;--azur-ink:#1B4FD6;--lagon:#0E9F8E;--corail:#D93A49;--ambre:#B26A00;--ciel:#5B7BB5;--ring:#D5DCEA;--shadow:0 24px 60px -24px rgba(20,33,61,.35)}
:root[data-theme=dark]{--bg:#0D1526;--surface:#162036;--ink:#E8EDF7;--ink2:#A3B0C9;--line:#26324D;--soft:#1C2740;--azur:#7FA2FF;--azur-ink:#A9C0FF;--lagon:#3FD1BF;--corail:#FF7A85;--ambre:#F5B84A;--ciel:#8FA6CF;--ring:#2A3654;--shadow:0 24px 60px -24px rgba(0,0,0,.7)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:1.5;transition:background .3s,color .3s}
h1,h2,h3,p{margin:0}
h1,h2,.display{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--azur-ink)}
:focus-visible{outline:3px solid var(--azur);outline-offset:2px;border-radius:8px}
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.rail{display:none}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:9px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:18px;margin-right:auto}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.search{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);padding:0 14px;display:flex;align-items:center;gap:8px}
.search kbd{display:none;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
main{padding:8px 18px 110px;max-width:1080px;width:100%;margin:0 auto}
.view{animation:enter .35s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tabs{position:fixed;left:12px;right:12px;bottom:12px;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow)}
.tabs a,.rail a{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;border-radius:16px;text-decoration:none;color:var(--ink2);font-size:11px;font-weight:500;transition:background .2s,color .2s}
.tabs a[aria-current],.rail a[aria-current]{background:var(--soft);color:var(--ink)}
.hello{font-size:15px;color:var(--ink2);margin-top:10px}
.lead{font-size:clamp(28px,6.4vw,44px);line-height:1.08;font-weight:700;margin-top:4px;max-width:16ch}
.today{display:grid;gap:8px;margin-top:8px}
.radar{position:relative;max-width:420px;width:100%;margin:0 auto}
.radar svg{display:block;width:100%;height:auto;overflow:visible}
.dot{transition:transform .9s cubic-bezier(.3,1.3,.5,1);cursor:pointer}
.dot circle{transition:fill .5s,r .3s}
.dot.hot .halo{animation:pulse 2.2s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(3.2);opacity:0}}
.core{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;fill:var(--ink)}
.rlabel{font-size:10px;font-weight:500;fill:var(--ink2);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.dot{outline:none}
.dot:focus-visible circle:nth-child(2){stroke:var(--ink)}
#radar .dot{transition:transform .9s cubic-bezier(.3,1.3,.5,1),opacity .2s}
#radar.hot .dot:not(.cur){opacity:.3}
.big3{gap:6px}.big3 i{width:9px;height:9px}
.chip{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:8px 12px;border-radius:12px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.key{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:14px}
.key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.section{margin-top:34px}
.section h2{font-size:22px;font-weight:700}
.section .hint{color:var(--ink2);font-size:14px;margin-top:2px}
.todo{list-style:none;padding:0;margin:14px 0 0}
.todo li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);transition:opacity .4s}
.todo li.done{opacity:.55}
.check{width:34px;height:34px;margin:5px;border-radius:50%;border:1.8px solid var(--ring);background:transparent;display:grid;place-items:center;transition:background .25s,border-color .25s,transform .25s}
.check svg{opacity:0;transform:scale(.4);transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.done .check{background:var(--lagon);border-color:var(--lagon);transform:scale(1.06)}
.done .check svg{opacity:1;transform:none}
.todo .t{font-weight:600}
.done .t{text-decoration:line-through}
.todo .m{font-size:14px;color:var(--ink2)}
.gain{font-size:13px;font-weight:600;color:var(--lagon);white-space:nowrap;background:color-mix(in srgb,var(--lagon) 13%,transparent);padding:3px 10px;border-radius:999px}
.link{background:none;border:0;padding:0;color:var(--azur-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.feed{list-style:none;padding:0 0 0 20px;margin:14px 0 0 5px;border-left:1.5px solid var(--line)}
.feed li{position:relative;padding:0 0 16px;font-size:15px}
.feed li:last-child{padding-bottom:0}
.feed li::before{content:"";position:absolute;left:-26px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--ring);box-shadow:0 0 0 4px var(--bg)}
.feed li.f-crit::before{background:var(--corail)}.feed li.f-ok::before{background:var(--lagon)}
.feed time{display:block;color:var(--ink2);font-size:13px}
.sev{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.sev i{width:9px;height:9px;border-radius:50%}
.s-crit{color:var(--corail)}.s-crit i{background:var(--corail)}
.s-high{color:var(--ambre)}.s-high i{background:var(--ambre)}
.s-med{color:var(--ciel)}.s-med i{background:var(--ciel)}
.s-ok{color:var(--lagon)}.s-ok i{background:var(--lagon)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.pill{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;font-weight:500;transition:all .2s}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rows{list-style:none;padding:0;margin:8px 0 0}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:16px 4px;border-radius:0;transition:background .2s,padding .2s}
.row:hover{background:var(--soft);padding-left:12px;padding-right:12px;border-radius:14px}
.row .t{display:block;font-weight:600;margin-top:4px}
.row .m{display:block;font-size:14px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}
.asset{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.asset .n{font-weight:600;overflow-wrap:anywhere}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:12px;overflow:hidden}
.bar b{display:block;height:100%;border-radius:3px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;margin-top:16px}
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.switch{flex:none;width:52px;height:32px;border-radius:16px;border:0;background:var(--ring);position:relative;transition:background .25s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.switch[aria-checked=true]{background:var(--azur)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.btn{min-height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--azur);color:#fff;font-weight:600;transition:transform .15s,filter .2s}
:root[data-theme=dark] .btn{color:#0D1526}
:root[data-theme=dark] .btn.ghost{color:var(--ink)}
:root[data-theme=dark] .btn.danger{color:var(--corail)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,16,30,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:22px 20px 28px;box-shadow:var(--shadow);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet h2{font-size:24px;line-height:1.15;margin-top:10px}
.sheet h3{font-size:14px;color:var(--ink2);font-weight:600;margin-top:20px}
.sheet ol{padding-left:20px;margin:8px 0 0}
.sheet li{margin:6px 0}
.sheet pre{background:var(--soft);border-radius:14px;padding:14px;font-size:13px;overflow:auto;white-space:pre-wrap;margin:8px 0 0;font-family:ui-monospace,Menlo,monospace}
.sheet .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.pal{position:fixed;z-index:30;left:50%;top:12vh;width:min(560px,92vw);transform:translate(-50%,-12px);opacity:0;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;transition:all .25s cubic-bezier(.2,.8,.2,1)}
.pal.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.pal input{width:100%;height:58px;border:0;background:none;color:var(--ink);font:inherit;font-size:17px;padding:0 20px;outline:none;border-bottom:1px solid var(--line)}
.pal ul{list-style:none;margin:0;padding:8px;max-height:46vh;overflow:auto}
.pal li button{width:100%;text-align:left;min-height:46px;border:0;background:none;border-radius:12px;padding:0 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.pal li button:hover,.pal li button.sel{background:var(--soft)}
.pal small{color:var(--ink2)}
.toast{position:fixed;z-index:40;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:500;transition:all .35s cubic-bezier(.3,1.4,.5,1);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.duo{display:grid;gap:10px;margin-top:10px}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px 16px;min-width:0}
.scorecard{display:grid;grid-template-columns:1fr;gap:6px}
.plot{position:relative;min-width:0}
.plot svg{touch-action:pan-y;cursor:crosshair}
.scorehead{display:flex;align-items:center;gap:10px}
.big{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:44px;line-height:.9;letter-spacing:-.04em}
.scoremeta{font-size:13px;color:var(--ink2);line-height:1.3}
.scoremeta .up{font-size:15px;font-weight:600;color:var(--lagon)}
.spark{margin:0;min-width:0;width:100%}
.scorefoot{grid-column:1/-1;font-size:13px;color:var(--ink2)}
.heat .hmgrid{gap:4px;min-width:0}
.heat .hm{height:34px;border-radius:10px;font-size:14px}
@media (min-width:900px){
 .duo{grid-template-columns:5fr 7fr;gap:16px;align-items:stretch}
 .card2{padding:24px;border-radius:28px}
 .scorecard{grid-template-columns:1fr;align-content:space-between;gap:16px}
 .big{font-size:96px}
 .scoremeta{font-size:15px}.scoremeta .up{font-size:20px}
 .scorefoot{font-size:14px}
 .heat .hmgrid{gap:6px}
 .heat .hm{height:40px}
}
.facts{display:flex;gap:8px 28px;flex-wrap:wrap;margin-top:14px;font-size:15px;color:var(--ink2)}
.facts b{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;color:var(--ink);margin-right:6px}
.rpanel{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px;margin-top:20px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rhead h2{font-size:22px}
.seg2{display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg2 button{min-height:38px;padding:0 14px;border:0;background:none;border-radius:10px;font-weight:500;color:var(--ink2);transition:all .2s}
.seg2 button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -2px rgba(20,33,61,.25)}
.chart .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.4,0,.2,1) forwards}
.chart .area{opacity:0;animation:fadeA .8s .7s forwards}
.chart .pt{opacity:0;animation:pop .35s cubic-bezier(.3,1.6,.5,1) forwards;transform-box:fill-box;transform-origin:center}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeA{to{opacity:.12}}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.hmwrap{overflow-x:auto;margin-top:14px}
.hmgrid{display:grid;gap:6px;align-items:center;min-width:330px}
.hmcol{font-size:12px;color:var(--ink2);text-align:center;font-weight:500}
.hmrow{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px}
.hm{display:grid;place-items:center;height:44px;border-radius:12px;border:0;font-weight:700;font-size:15px;opacity:0;animation:pop .4s cubic-bezier(.3,1.5,.5,1) forwards;transition:transform .18s,box-shadow .18s}
button.hm:hover{transform:scale(1.08);box-shadow:0 6px 16px -6px rgba(20,33,61,.45)}
.hm.na{background:var(--soft);height:44px;opacity:0}
.hm.ok{background:color-mix(in srgb,var(--lagon) 16%,var(--surface));color:var(--lagon)}
.hm.med{background:color-mix(in srgb,var(--ciel) 38%,var(--surface));color:var(--ink)}
.hm.high{background:color-mix(in srgb,var(--ambre) 45%,var(--surface));color:var(--ink)}
.hm.crit{background:var(--corail);color:#fff}
:root[data-theme=dark] .hm.high,:root[data-theme=dark] .hm.crit{color:#0D1526}
.chk{display:grid;grid-template-columns:minmax(96px,150px) 1fr auto;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.checks .rhead{padding-bottom:10px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;box-sizing:border-box;border:1.5px solid var(--corail)}
.dots i.on{background:var(--lagon);border-color:var(--lagon)}
.chk .num{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:15px}
.chk .num small{font-family:Figtree,sans-serif;font-weight:400;font-size:13px;color:var(--ink2)}
.heat{position:relative}
.hmcol,.hmrow{transition:color .15s}
.hmcol.on,.hmrow.on{color:var(--azur-ink);font-weight:700}
.hm.na{background:none}
.hm.na i{width:5px;height:5px;border-radius:50%;background:var(--ring)}
button.hm:hover,button.hm:focus-visible,.hm.na:hover{outline:2px solid var(--ink);outline-offset:1px}
.hmgrid.hot .hm:not(.cur){filter:saturate(.55);opacity:.55!important}
.hmgrid.hot .hm.cur{transform:scale(1.1)}
.hmtip{position:absolute;z-index:3;width:max-content;max-width:240px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.4;pointer-events:none;opacity:0;transform:translate(-50%,calc(-100% - 4px));transition:opacity .15s,transform .15s;box-shadow:var(--shadow)}
.hmtip.on{opacity:1;transform:translate(-50%,calc(-100% - 10px))}
.hmtip.below{transform:translate(-50%,4px)}
.hmtip.below.on{transform:translate(-50%,10px)}
.hmtip b{display:block;font-size:14px}
.hmtip span{display:flex;gap:7px;align-items:baseline;margin-top:4px}
.hmtip span i{flex:none;width:7px;height:7px;border-radius:50%}
.hmtip em{display:block;font-style:normal;opacity:.75}.hmtip span+em{margin-top:6px}
.segrow{margin-top:18px;font-size:15px}
.segrow>div:first-child{display:flex;justify-content:space-between;gap:10px}
.segs{display:flex;gap:4px;margin-top:8px}
.segs i{flex:1;height:10px;border-radius:5px;background:transparent;border:1.5px solid var(--corail)}
.segs i.on{background:var(--lagon);border-color:var(--lagon)}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.doc{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:20px}
.doc h3{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;margin:0}
.doc p{font-size:14px;color:var(--ink2);margin:4px 0 12px}
.paper{flex:none;width:92px;height:122px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;gap:6px;transform:rotate(-4deg);box-shadow:0 10px 20px -12px rgba(20,33,61,.5);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.doc:hover .paper{transform:rotate(0) translateY(-4px)}
.paper b{display:block;height:8px;width:60%;border-radius:4px;background:var(--ink)}
.paper i{display:block;height:4px;border-radius:2px;background:var(--ring)}
.paper u{display:block;height:6px;border-radius:3px;background:var(--soft);border-left:10px solid var(--corail)}
.paper u:nth-of-type(2){border-left-color:var(--ambre)}.paper u:nth-of-type(n+3){border-left-color:var(--ciel)}
.paper svg{width:100%;height:auto}
.top .brand{text-decoration:none;color:var(--ink);border-radius:10px}
.rail .logo{border-radius:14px;transition:background .2s}.rail .logo:hover{background:var(--soft)}
.avatar{text-decoration:none;font-weight:700;font-size:14px;color:var(--azur-ink);background:color-mix(in srgb,var(--azur) 14%,var(--surface))}
body.public .rail,body.public .top,body.public .tabs{display:none}
body.public .shell{grid-template-columns:1fr}
body.public main{max-width:1120px;padding-bottom:40px}
.pubhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0}
.pubhead .brand{text-decoration:none;color:var(--ink);margin:0}
.pubhead nav{display:flex;align-items:center;gap:4px 18px;flex-wrap:wrap;font-size:15px}
.pubhead nav a{color:var(--ink2);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.pubhead nav a[aria-current]{color:var(--ink);font-weight:600}
.btn.sm,.pubhead nav a.btn{min-height:40px;padding:0 14px;color:#fff}
:root[data-theme=dark] .pubhead nav a.btn{color:#0D1526}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
a.btn.ghost{color:var(--ink)}
.hero{display:grid;gap:24px;align-items:center;padding:28px 0 8px}
.hero h1,.phead h1{font-size:clamp(34px,7.2vw,64px);line-height:1.02;font-weight:700;max-width:14ch}
.herosub{font-size:18px;color:var(--ink2);margin-top:16px;max-width:46ch}
.hero .addrow{margin-top:24px;max-width:520px}
.herovis{max-width:400px;width:100%;margin:0 auto}
.hradar{display:block;width:100%;height:auto;overflow:visible}
.hradar .sweep{transform-origin:150px 150px;opacity:0}
.hradar.scanning .sweep{opacity:1;animation:rot 1.6s linear infinite}
.hradar .pt{opacity:0;animation:pop .45s cubic-bezier(.3,1.6,.5,1) forwards;transform-box:fill-box;transform-origin:center}
.demores{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;max-width:520px;animation:rowin .4s}
.demores ul{list-style:none;padding:0;margin:12px 0 16px}

    const SX = i => 34 + i * (276 / (n - 1)), SY = v => 102 - (v - 40) / 60 * 92;

    // Smooth curve through the points (Catmull-Rom converted to cubic Béziers).
    const spark = pts.map((q, i) => { if (!i) return 'M' + q[0].toFixed(1) + ' ' + q[1].toFixed(1); const p0 = pts[Math.max(0, i - 2)], p1 = pts[i - 1], p3 = pts[Math.min(n - 1, i + 1)], k = 0.18; return 'C' + (p1[0] + (q[0] - p0[0]) * k).toFixed(1) + ' ' + (p1[1] + (q[1] - p0[1]) * k).toFixed(1) + ' ' + (q[0] - (p3[0] - p1[0]) * k).toFixed(1) + ' ' + (q[1] - (p3[1] - p1[1]) * k).toFixed(1) + ' ' + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }).join(' ');

    ${hist.map((v, i) => (n <= 6 || i % 3 === 2 || i === 0) ? `<line x1="${SX(i).toFixed(1)}" x2="${SX(i).toFixed(1)}" y1="102" y2="106" stroke="var(--ring)" stroke-width="1.2"/>` : '').join('')}
    <text x="34" y="120" font-size="11" fill="var(--ink2)">Il y a ${n} sem.</text><text x="310" y="120" font-size="11" fill="var(--ink2)" text-anchor="end">Aujourd’hui</text>

  else if (t.dataset.lang) { state.me.lang = t.dataset.lang; draw(false); toast(t.dataset.lang === 'en' ? 'Anglais : bientôt disponible' : 'Interface en français'); }
  else if (t.dataset.revoke) { const li = t.closest('li'); li.classList.add('gone'); const id = t.dataset.revoke; setTimeout(() => { state.sessions = state.sessions.filter(s => s.id !== id); if (current === 'profil') draw(false); }, 380); toast('Appareil déconnecté'); }
  else if (t.dataset.me) {
    const me = state.me, a = t.dataset.me;
    if (a === 'edit') { me.editing = true; draw(false); $('#name-in').focus(); }
    else if (a === 'save') { const v = $('#name-in').value.trim(); if (v.length < 2) { $('#name-err').textContent = 'Saisissez votre nom.'; $('#name-in').focus(); } else { me.name = v; me.editing = false; draw(false); $('.avatar').textContent = v.split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase(); toast('Nom enregistré'); } }
    else if (a === 'pw') { me.pwOpen = !me.pwOpen; draw(false); if (me.pwOpen) $('#pw').focus(); }
    else if (a === 'pwsave') { if (pwScore($('#pw').value) < 3) { $('#pw-err').textContent = 'Ce mot de passe est trop faible. Allongez-le ou ajoutez des chiffres et des symboles.'; $('#pw').focus(); } else { me.pwOpen = false; draw(false); toast('Mot de passe mis à jour (démonstration)'); } }
  }
  else if (t.dataset.af) { state.assetFilter = t.dataset.af; draw(false); }
  else if (t.dataset.add) {
    const ad = state.add;
    if (t.dataset.add === 'reset') state.add = { step: 0, domain: '', err: '' };
    else if (t.dataset.add === 'next') { const v = ($('#add-in').value || '').trim().toLowerCase(); if (!/^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}$/.test(v)) { ad.domain = v; ad.err = v ? 'Ce nom de domaine n’est pas valide. Exemple : votre-entreprise.cg' : 'Saisissez un nom de domaine.'; } else { ad.domain = v; ad.err = ''; ad.step = 1; } }
    else if (t.dataset.add === 'verify') { ad.step = 2; setTimeout(() => { if (state.add.step === 2) { state.add.step = 3; if (current === 'actifs') draw(false); } }, 1800); }
    draw(false);
    if (state.add.err) { const inp = $('#add-in'); if (inp) inp.focus(); }
  }
  else if (t.dataset.day !== undefined) { state.sched.day = Number(t.dataset.day); draw(false); }
  else if (t.dataset.freq) { state.sched.freq = t.dataset.freq; draw(false); }
  else if (t.dataset.level) { state.level = t.dataset.level; draw(false); }
  else if (t.dataset.themeSet) { root.dataset.theme = t.dataset.themeSet; draw(false); }
  else if (t.dataset.test) {
    const [name, msg] = PREVIEW[t.dataset.test], box = $('#preview');
    box.innerHTML = `<p class="pfrom">Aperçu du message, ${name}</p><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>`;
    setTimeout(() => { const b = box.querySelector('.bubble'); if (b) { b.textContent = msg; b.classList.add('in'); } }, 900);
  }
  else if (t.dataset.toast) toast(t.dataset.toast);
  else if (t.dataset.fixSheet) { const id = t.dataset.fixSheet; closeAll(); toggleFix(id); }
  else if (t.dataset.pal) runPal(Number(t.dataset.pal));
  else if (t.hasAttribute('data-close')) closeAll();
  else if (t.classList.contains('dot')) { rdOut(); openAsset(t.dataset.asset); }
});
function showChip(n) { const o = openOf(n); state.chip = o.length ? `${n} : ${o[0].short.toLowerCase()}` : `${n} : aucun problème ouvert`; const c = $('#chip'); if (c) c.textContent = state.chip; }
const CATNAME = { emails: 'Emails', tls: 'Chiffrement', ports: 'Ports et services', fuites: 'Fuites de données', menaces: 'Menaces émergentes' };
function hmTip(cell) {
  const tip = $('#hmtip'); if (!tip) return;
  const asset = cell.dataset.hmAsset, cat = cell.dataset.hmCat, grid = cell.closest('.hmgrid');
  const list = ISSUES.filter(i => i.asset === asset && CAT[i.module] === cat && !state.fixed[i.id]);
  let body;
  if (cell.classList.contains('na')) body = '<em>Non concerné : ce contrôle ne s\u2019applique pas à cet actif.</em>';
  else if (!list.length) body = '<span><i style="background:var(--lagon)"></i>Vérifié, rien à signaler.</span>';
  else body = list.map(i => `<span><i style="background:${COLOR[i.sev]}"></i>${esc(i.title)}</span>`).join('') + '<em>Cliquez pour ouvrir l\u2019actif</em>';
  tip.innerHTML = `<b>${esc(asset)}</b><em>${CATNAME[cat]}</em>${body}`;
  const host = tip.parentElement.getBoundingClientRect(), r = cell.getBoundingClientRect();
  const half = Math.min(120, host.width / 2 - 8);
  tip.style.left = Math.max(half + 8, Math.min(host.width - half - 8, r.left - host.left + r.width / 2)) + 'px';
  { const below = r.top - tip.offsetHeight - 14 < 84; tip.classList.toggle('below', below); tip.style.top = ((below ? r.bottom : r.top) - host.top) + 'px'; }
  tip.classList.add('on');
  grid.classList.add('hot');
  grid.querySelectorAll('.cur,.on').forEach(x => x.classList.remove('cur', 'on'));
  cell.classList.add('cur');
  const row = grid.querySelector(`[data-row="${asset}"]`), col = grid.querySelector(`[data-col="${cat}"]`);
  if (row) row.classList.add('on'); if (col) col.classList.add('on');
}
function chartHover(e) {
  const svg = $('#spark'); if (!svg || !chartData) return;
  const { hist, n, SX, SY } = chartData, r = svg.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 320;
  const i = Math.max(0, Math.min(n - 1, Math.round((x - 34) / (276 / (n - 1)))));
  const cx = SX(i), cy = SY(hist[i]);
  const line = $('#ch-line'), dot = $('#ch-dot'), tip = $('#chtip');
  line.setAttribute('x1', cx); line.setAttribute('x2', cx); line.setAttribute('opacity', 1);
  dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('opacity', 1);
  const d = i ? hist[i] - hist[i - 1] : 0, back = n - 1 - i;
  tip.innerHTML = `<b>${hist[i]} points</b><em>${back === 0 ? 'Aujourd\u2019hui' : back === 1 ? 'La semaine dernière' : 'Il y a ' + back + ' semaines'}</em>${i ? `<span><i style="background:${d >= 0 ? 'var(--lagon)' : 'var(--corail)'}"></i>${d >= 0 ? '+' : '\u2212'}${Math.abs(d)} par rapport à la semaine d\u2019avant</span>` : ''}`;
  const host = tip.parentElement.getBoundingClientRect(), px = r.left - host.left + cx / 320 * r.width;
  tip.style.left = Math.max(92, Math.min(host.width - 92, px)) + 'px';
  { const py = r.top + cy / 124 * r.height, below = py - tip.offsetHeight - 18 < 84; tip.classList.toggle('below', below); tip.style.top = (py - host.top + (below ? 8 : 0)) + 'px'; }
  tip.classList.add('on');
}
function chartOut() { ['#ch-line', '#ch-dot'].forEach(s => { const el = $(s); if (el) el.setAttribute('opacity', 0); }); const tip = $('#chtip'); if (tip) tip.classList.remove('on'); }
document.addEventListener('pointermove', e => { if (e.target.closest && e.target.closest('#spark')) chartHover(e); else chartOut(); });
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('#spark')) chartHover(e); });
function rdTip(dot) {
  const tip = $('#rdtip'), svg = $('#radar'); if (!tip || !svg) return;
  const n = dot.dataset.asset, a = ASSETS.find(x => x.n === n), list = openOf(n), w = worst(n);
  tip.innerHTML = `<b>${esc(n)}</b><em>${a.k}</em>` + (list.length ? list.map(i => `<span><i style="background:${COLOR[i.sev]}"></i>${esc(i.title)}</span>`).join('') : '<span><i style="background:var(--lagon)"></i>Protégé, aucun problème ouvert.</span>') + '<em>Cliquez pour ouvrir l\u2019actif</em>';
  const host = tip.parentElement.getBoundingClientRect(), r = dot.querySelectorAll('circle')[1].getBoundingClientRect();
  tip.style.left = Math.max(126, Math.min(host.width - 126, r.left - host.left + r.width / 2)) + 'px';
  { const below = r.top - tip.offsetHeight - 14 < 84; tip.classList.toggle('below', below); tip.style.top = ((below ? r.bottom : r.top) - host.top) + 'px'; }
  tip.classList.add('on');
  const rad = a.a * Math.PI / 180, d = DIST[w], line = $('#rd-line');
  line.setAttribute('x2', (150 + d * Math.cos(rad)).toFixed(1)); line.setAttribute('y2', (150 + d * Math.sin(rad)).toFixed(1)); line.setAttribute('opacity', 1);
  svg.classList.add('hot'); svg.querySelectorAll('.dot.cur').forEach(x => x.classList.remove('cur')); dot.classList.add('cur');
}
function rdOut() { const tip = $('#rdtip'); if (!tip) return; tip.classList.remove('on'); const svg = $('#radar'); if (svg) { svg.classList.remove('hot'); svg.querySelectorAll('.dot.cur').forEach(x => x.classList.remove('cur')); } const l = $('#rd-line'); if (l) l.setAttribute('opacity', 0); }
document.addEventListener('mouseover', e => { const c = e.target.closest && e.target.closest('.dot'); if (c) rdTip(c); else rdOut(); });
document.addEventListener('focusin', e => { const c = e.target.closest && e.target.closest('.dot'); if (c) rdTip(c); });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('.dot')) rdOut(); });
function hmOut() { const tip = $('#hmtip'); if (!tip) return; tip.classList.remove('on'); const g = $('.hmgrid'); if (g) { g.classList.remove('hot'); g.querySelectorAll('.cur,.on').forEach(x => x.classList.remove('cur', 'on')); } }
document.addEventListener('mouseover', e => { const c = e.target.closest && e.target.closest('.hm'); if (c) hmTip(c); else if (!e.target.closest || !e.target.closest('.hmgrid')) hmOut(); });
document.addEventListener('focusin', e => { const c = e.target.closest && e.target.closest('.hm'); if (c) hmTip(c); });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('.hm')) hmOut(); });
$('#scrim').addEventListener('click', closeAll);
$('#open-pal').addEventListener('click', openPal);
$('#pal-in').addEventListener('input', () => { palSel = 0; drawPal(); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'hour') {
    state.sched.hour = Number(el.value); $('#hour-out').textContent = String(state.sched.hour).padStart(2, '0') + ':00'; $('#next-scan').textContent = schedText();
    document.querySelectorAll('.clock i').forEach((x, h) => x.classList.toggle('on', h === state.sched.hour));
  } else if (el.id === 'rate') {
    state.rate = Number(el.value); $('#rate-out').textContent = state.rate + ' requêtes par seconde'; $('#rate-hint').textContent = rateHint(state.rate);
    $('#pulse').style.setProperty('--spd', (3.2 - state.rate / 80).toFixed(2) + 's');
  } else if (el.id === 'add-in') { state.add.domain = el.value; }
  else if (el.id === 'demo-in') { state.demo.domain = el.value; }
  else if (el.dataset && el.dataset.otp !== undefined) {
    el.value = el.value.replace(/\D/g, '').slice(-1); el.classList.toggle('filled', !!el.value);
    const i = +el.dataset.otp;
    if (el.value && i < 5) document.querySelector(`[data-otp="${i + 1}"]`).focus();
    if (el.value && [...document.querySelectorAll('[data-otp]')].every(x => x.value)) document.querySelector('[data-form="mfa"]').requestSubmit();
  }
  else if (el.id === 'cc-num') {
    const d = el.value.replace(/\D/g, '').slice(0, 19); el.value = d.replace(/(.{4})/g, '$1 ').trim();
    $('#cc-brand').textContent = /^4/.test(d) ? 'Visa' : /^(5[1-5]|2[2-7])/.test(d) ? 'Mastercard' : '';
  }
  else if (el.id === 'cc-exp') { const d = el.value.replace(/\D/g, '').slice(0, 4); el.value = d.length > 2 ? d.slice(0, 2) + ' / ' + d.slice(2) : d; }
  else if (el.id === 'cc-cvc') { el.value = el.value.replace(/\D/g, '').slice(0, 4); }
  else if (el.id === 'mm-phone') { const d = el.value.replace(/\D/g, '').slice(0, 9); el.value = d.replace(/^(\d{2})(\d{0,3})(\d{0,2})(\d{0,2}).*/, (m, a, b, c, e2) => [a, b, c, e2].filter(Boolean).join(' ')); }
  else if (el.id === 'pw') {
    const s = pwScore(el.value), m = $('#pwmeter'); m.className = 'pwmeter s' + s;
    $('#pwhint').textContent = !el.value ? '12 caractères au moins, avec des chiffres et des symboles.' : ['Trop court.', 'Faible.', 'Moyen : ajoutez des symboles ou allongez-le.', 'Bon.', 'Très solide.'][s];
    $('#pw-err').textContent = '';
  }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); return; }
  if (e.key === 'Escape') { closeAll(); return; }
  if ($('#pal').classList.contains('on')) {
    if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palCur.length - 1, palSel + 1); drawPal(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(0, palSel - 1); drawPal(); }
    else if (e.key === 'Enter') { e.preventDefault(); runPal(palSel); }
  } else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('dot')) { e.preventDefault(); rdOut(); openAsset(e.target.dataset.asset); }
});
const root = document.documentElement;
root.dataset.theme = 'light';
function flipTheme() { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; if (current === 'reglages') draw(false); }
$('#theme').addEventListener('click', flipTheme);
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('[data-flip-theme]')) flipTheme(); });
window.addEventListener('hashchange', route);
route();
