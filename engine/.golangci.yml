# golangci-lint configuration (v2 format). Run from engine/:
#   go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - gosec      # security mistakes (weak crypto, injections, unsafe conversions)
    - errorlint  # errors compared with == instead of errors.Is/As
    - bodyclose  # HTTP response bodies left open
    - misspell
    - unconvert
  settings:
    misspell:
      # misspell knows English only, and findings carry French texts too
      # (Finding.Localized): these are correct French words it mistakes
      # for English typos. Kept as a list so English stays checked.
      ignore-rules:
        - administrer
        - administrez
        - certificats
        - clientes
        - commandes
        - conteneurs
        - demandes
        - distribuent
        - exemple
        - interm      # "intermédiaires", cut at the accent
        - lecteurs
        - manipulant
        - principales
        - protocoles
        - recommandation
        - recommande
        - relient
        - responsable
        - strat       # "stratégie", cut at the accent
        - surveill
        - trafic
    errcheck:
      exclude-functions:
        # "defer tx.Rollback(ctx)" is the standard pgx pattern: after Commit
        # it is a no-op, and after a failure the transaction is discarded
        # whatever Rollback returns.
        - (github.com/jackc/pgx/v5.Tx).Rollback
        # Human-readable output to stdout or a strings.Builder. Failures of
        # tabwriter output are still checked through Flush.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    staticcheck:
      checks:
        # The defaults...
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # ...minus De Morgan rewrites: "!(a-z or 0-9 or -)" reads better
        # than its expanded form.
        - -QF1001

issues:
  # Report everything, not only the first few of each kind.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
