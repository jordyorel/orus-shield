{{define "title"}}Connexion{{end}}
{{define "content"}}
<div class="stack">
<div class="stack-sm">
<h1>Connexion</h1>
<p class="muted">Accédez au tableau de bord de votre organisation.</p>
</div>
{{template "messages" .}}
<form method="post" action="/login" class="stack">
<div class="field">
<label for="email">Adresse e-mail</label>
<input id="email" name="email" type="email" autocomplete="username" required value="{{.Data.Email}}"{{if not .Data.Email}} autofocus{{end}}>
</div>
<div class="field">
<label for="password">Mot de passe</label>
<input id="password" name="password" type="password" autocomplete="current-password" required{{if .Data.Email}} autofocus{{end}}>
</div>
<button class="btn btn-primary btn-block" type="submit">Se connecter</button>
</form>
<p class="small muted">Première connexion ? <a href="/setup-password">Définissez votre mot de passe</a> avec le code d'activation reçu de votre administrateur.</p>
</div>
{{end}}
