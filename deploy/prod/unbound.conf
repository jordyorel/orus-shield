# Our own DNS resolver (ORUS_DNS_SERVER=127.0.0.1:5335), installed by
# setup.sh as /etc/unbound/unbound.conf.d/orus.conf.
#
# Why our own: ownership checks (forward-confirmed reverse DNS) decide what
# an active scan may touch, and a network's resolver once kept a stale
# NXDOMAIN for over an hour (lab test, 2026-11-11). Unbound resolves from
# the root servers itself and validates DNSSEC.
server:
	# Port 5335, not 53: systemd-resolved keeps 127.0.0.53:53 for the
	# system, and the scanners' sandbox refuses this port (firewall.nft).
	interface: 127.0.0.1@5335
	interface: ::1@5335
	access-control: 127.0.0.0/8 allow
	access-control: ::1/128 allow
	do-ip6: yes

	# A record just published must be seen quickly: cap the negative cache
	# (NXDOMAIN) at one minute, and never serve an expired answer.
	cache-max-negative-ttl: 60
	serve-expired: no
	prefetch: yes

	qname-minimisation: yes
	harden-glue: yes
	harden-dnssec-stripped: yes
	harden-below-nxdomain: yes
	hide-identity: yes
	hide-version: yes
	# Customers' domains may point at private addresses; the worker refuses
	# them anyway (quicktest.Public), so answers are not filtered here.
